services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strapi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: strapi_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    # FIX 3: Isolated to the backend network
    networks:
      - database_net
    # FIX 2: Structural Healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi_user -d strapi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    build:
      context: .
      target: back
      args:
        NEXT_PUBLIC_API_URL: https://backoffice.wubrg.online
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # Waits for pg_isready
    environment:
      - HOST=0.0.0.0
      - PORT=1337
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${API_TOKEN_SALT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=strapi_db
      - DATABASE_USERNAME=strapi_user
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - strapi_uploads:/app/public
    # Connects to both DB and the public-facing proxy
    networks:
      - database_net
      - public_net

  front:
    build:
      context: .
      target: front
      # FIX 1: Pass the variable directly into the Build Stage
      args:
        NEXT_PUBLIC_API_URL: https://backoffice.wubrg.online
    restart: unless-stopped
    # Front only needs to talk to the proxy
    networks:
      - public_net

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - front
      - back
    # Proxy bridges the outside world to the frontend/backend
    networks:
      - public_net

volumes:
  pg_data:
  strapi_uploads:
  caddy_data:
  caddy_config:

# FIX 3: Explicit Network Definitions
networks:
  public_net:
  database_net: